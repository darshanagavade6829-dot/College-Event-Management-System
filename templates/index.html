<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CEMS{% endblock %} | College Event Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-nav">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🎓 CEMS</a>
    <div class="navbar-nav ms-auto flex-row gap-3">
      <a class="nav-link" href="{{ url_for('index') }}">Events</a>
      <a class="nav-link" href="{{ url_for('registrations') }}">Registrations</a>
      <a class="nav-link" href="{{ url_for('results') }}">Results</a>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert {{ 'alert-success' if category == 'success' else 'alert-warning' }} alert-dismissible fade show">
          {{ message }} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="text-center py-4 text-secondary small">College Event Management System · DBMS Mini Project</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
